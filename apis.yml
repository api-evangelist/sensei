name: Sensei
description: Sensei is an autonomous retail technology company that uses computer vision and artificial
  intelligence to enable checkout-free, "frictionless" shopping with no scanning and no queues, while
  giving retailers real-time inventory visibility and operational insights. It ships in four formats —
  Store (full-store), Pod (24/7 autonomous unit), Cabinet (plug-and-play), and Lane (human-assisted
  express checkout) — serving supermarkets, workplaces, mobility hubs, education, hospitality, leisure,
  and health/wellness venues. Founded in Portugal (HQ Castelo Branco, with Lisbon, São Paulo, and Milan
  offices), Sensei is a Techstars-backed company that works with retailers such as Continente, Conad,
  NOS, Muffato, and Galp and technical partners including Mastercard and HP. Sensei is a hardware and
  computer-vision provider and publishes no public API, SDK, or developer documentation; engagement is
  demo-based ("book a demo") rather than developer self-serve.
